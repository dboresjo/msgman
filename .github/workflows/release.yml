# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    # Built on the oldest still-supported Ubuntu LTS (24.04), not the newest.
    # Unlike macOS, glibc is backward-compatible: a binary linked against an
    # older glibc runs fine on a newer one (e.g. 26.04), but not the reverse,
    # so building on 24.04 covers both without needing a build per version.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (sbt 2.x's minimum)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libcurl4-openssl-dev libssl-dev libidn2-dev
      - name: Build (with AI translation support for all providers)
        run: sbt -no-colors "-Dmsgman.aiProviders=openai,claude,gemini" nativeLink
      - name: Package .deb
        run: ./package-deb "${GITHUB_REF_NAME#v}"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: msgman_*_${{ matrix.arch }}.deb

  build-macos:
    # Built per macOS version, not just once, since a Scala Native binary
    # built on a newer macOS is not guaranteed to run on an older one; each
    # version gets its own tarball so a future Homebrew formula can pick the
    # right one for the machine it's installing on. All are Apple Silicon
    # (arm64); GitHub has no Intel image beyond macos-13.
    strategy:
      fail-fast: false
      matrix:
        macos: [ "15", "26" ]

    runs-on: macos-${{ matrix.macos }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (sbt 2.x's minimum)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Install build dependencies
        run: |
          # curl's headers ship with the Xcode SDK, but Apple stopped shipping
          # OpenSSL headers years ago, and doesn't ship libidn2 at all (the
          # sttp curl backend links against it explicitly, whether or not the
          # code actually uses it), so both need to come from Homebrew; their
          # include/lib dirs aren't on clang's default search path, so they're
          # exported for the sbt/nativeLink step below.
          brew install openssl@3 libidn2
          echo "CPATH=$(brew --prefix openssl@3)/include:$(brew --prefix libidn2)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$(brew --prefix libidn2)/lib" >> "$GITHUB_ENV"
      - name: Build (with AI translation support for all providers)
        run: sbt -no-colors "-Dmsgman.aiProviders=openai,claude,gemini" nativeLink
      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="$(find target/out -type f -name msgman | xargs ls -t | head -n1)"
          OUT="msgman_${VERSION}_darwin_arm64_macos${{ matrix.macos }}.tar.gz"
          tar -czf "$OUT" -C "$(dirname "$BINARY")" msgman
          echo "Built ${OUT}"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-darwin-arm64-macos${{ matrix.macos }}
          path: msgman_*_darwin_arm64_macos${{ matrix.macos }}.tar.gz

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  publish-plugin:
    # Publishes sbt-msgman (plugin/) to Maven Central via the Central Portal.
    # Independent of the native CLI's own artifacts (build-linux/build-macos/
    # release above), so it runs in parallel rather than waiting on them.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (sbt 2.x's minimum)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.PGP_SECRET }}
      - name: Publish and bundle
        run: |
          export MSGMAN_PLUGIN_VERSION="${GITHUB_REF_NAME#v}"
          sbt -no-colors "plugin/publishSigned; plugin/sonaBundle"
      - name: Upload bundle to Central Portal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          # sbt 2.0.1's built-in sonaUpload/sonaRelease commands don't register
          # in this version (confirmed against gitbucket, a real project on sbt
          # 1.12.15 where they do work; likely a gap specific to early sbt 2.x).
          # sonaBundle itself works fine, so the upload step is done directly
          # against the Central Portal's REST API instead. USER_MANAGED means
          # the deployment still needs manual confirmation on
          # central.sonatype.com before it actually goes live on Central; switch
          # to AUTOMATIC once confident in this pipeline.
          TOKEN="$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0)"
          curl --fail --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --form bundle=@target/sona-bundle/bundle.zip \
            --form publishingType=USER_MANAGED \
            https://central.sonatype.com/api/v1/publisher/upload
